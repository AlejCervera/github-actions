name: Ejercicio-3

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py: ["3.10", "3.11", "3.12"] # Definición de las versiones de Python
    steps:
      # Uso de la variable para elegir la versión de Python
      - name: Instalar Python ${{ matrix.py }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Test
        run: python --version
